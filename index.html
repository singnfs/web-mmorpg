<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>StepQuest — Travel RPG</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Halaman Login -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <div class="avatar" style="margin: 0 auto 15px auto; width: 60px; height: 60px; font-size: 35px;"><i class="fa-solid fa-jedi"></i></div>
        <h2>StepQuest</h2>
        <p style="margin-bottom: 20px; font-size: 13px; color: #a0a0a0;">Login / Daftar otomatis</p>
        
        <input type="text" id="username" placeholder="Username (Ketik 'admin' utk Admin)" autocomplete="off">
        <input type="password" id="password" placeholder="Password">
        
        <button class="btn-login" onclick="doLogin()">Masuk Game</button>
    </div>
</div>

<script src="layout.js"></script>

<script src="/socket.io/socket.io.js"></script>
<script src="items-db.js"></script>
<script src="script.js"></script>
</body>
</html>
